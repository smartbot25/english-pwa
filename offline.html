<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin Conexión - English Master</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #F9FAFB;
            color: #1F2937;
        }
        .offline-container {
            text-align: center;
            padding: 2rem;
        }
        h1 { color: #4F46E5; }
        .icon { font-size: 4rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="icon">📡</div>
        <h1>Sin Conexión</h1>
        <p>No tienes conexión a internet en este momento.</p>
        <p>Las lecciones ya descargadas seguirán disponibles.</p>
        <button onclick="location.reload()" style="
            margin-top: 1rem;
            padding: 1rem 2rem;
            background: #4F46E5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        ">🔄 Reintentar</button>
    </div>
</body>
</html>
