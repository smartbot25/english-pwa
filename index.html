<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4F46E5">
    <meta name="description" content="Aprende inglés de forma interactiva - speaking, listening, writing, reading">
    <title>English Master PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
</head>
<body>
    <header class="app-header">
        <h1>🇬🇧 English Master</h1>
        <div id="connection-status" class="status online">● Online</div>
    </header>

    <nav class="main-nav">
        <button class="nav-btn active" data-section="home">🏠 Inicio</button>
        <button class="nav-btn" data-section="lessons">📚 Lecciones</button>
        <button class="nav-btn" data-section="practice">💬 Practicar</button>
        <button class="nav-btn" data-section="progress">📊 Progreso</button>
    </nav>

    <main id="app-content">
        <!-- Sección: Inicio -->
        <section id="home" class="section active">
            <div class="welcome-card">
                <h2>¡Bienvenido a tu curso de inglés!</h2>
                <p>Aprende las 4 habilidades: speaking, listening, writing y reading</p>
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-number" id="total-lessons">0</span>
                        <span class="stat-label">Lecciones completadas</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-number" id="words-learned">0</span>
                        <span class="stat-label">Palabras aprendidas</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-number" id="practice-time">0</span>
                        <span class="stat-label">Minutos de práctica</span>
                    </div>
                </div>
                <button id="start-learning" class="cta-button">Comenzar Ahora</button>
            </div>
        </section>

        <!-- Sección: Lecciones -->
        <section id="lessons" class="section">
            <h2>Lecciones Interactivas</h2>
            <div id="lessons-container" class="lessons-grid"></div>
        </section>

        <!-- Sección: Practicar -->
        <section id="practice" class="section">
            <div class="practice-modes">
                <button class="mode-btn active" data-mode="speaking">🎤 Speaking</button>
                <button class="mode-btn" data-mode="listening">👂 Listening</button>
                <button class="mode-btn" data-mode="writing">✍️ Writing</button>
                <button class="mode-btn" data-mode="reading">📖 Reading</button>
            </div>
            
            <div id="practice-area" class="practice-area">
                <!-- Contenido dinámico según modo -->
            </div>
        </section>

        <!-- Sección: Progreso -->
        <section id="progress" class="section">
            <h2>Tu Progreso</h2>
            <div class="progress-chart">
                <canvas id="progress-chart"></canvas>
            </div>
            <div class="achievements">
                <h3>Logros</h3>
                <div id="achievements-list"></div>
            </div>
        </section>
    </main>

    <div id="install-prompt" class="install-prompt hidden">
        <p>📲 Instala esta app para aprender offline</p>
        <button id="install-btn">Instalar</button>
        <button id="dismiss-install">Ahora no</button>
    </div>

    <script src="storage.js"></script>
    <script src="js/speech.js"></script>
    <script src="js/lessons.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
